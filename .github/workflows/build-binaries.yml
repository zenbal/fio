name: Build fio 3.43 ARM64 artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
            required-engine: posixaio
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            required-engine: libaio

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux build dependencies
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential libaio-dev

      - name: Build and audit fio
        env:
          OUTPUT_DIR: ${{ runner.temp }}/fio-artifacts
        run: ./ci/build-fio-artifact.sh "${{ matrix.target }}"

      - name: Upload verified artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: fio-${{ matrix.target }}
          path: ${{ runner.temp }}/fio-artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Record artifact link
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo '### ${{ matrix.target }}'
            echo
            echo "Artifact: ${ARTIFACT_URL}"
            echo "Required engines: psync and ${{ matrix.required-engine }}"
          } >> "$GITHUB_STEP_SUMMARY"
